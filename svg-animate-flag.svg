<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000">
  <rect width="1000" height="1000" fill="white"/>
  <text x="10" y="50" font-size="20" fill="transparent">
    <animate attributeName="fill" from="transparent" to="red" dur="1s" begin="1s" fill="freeze"/>
    <animate attributeName="text" from="" to="file:///flag.txt" dur="1s" begin="1s" fill="freeze"/>
  </text>
</svg> 