<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000">
  <rect width="1000" height="1000" fill="white"/>
  <text id="flagText" x="10" y="50" font-size="20" fill="transparent">Loading flag...</text>
  <script type="text/javascript">
    fetch('/flag.txt')
      .then(response => response.text())
      .then(data => {
        document.getElementById('flagText').textContent = data;
        document.getElementById('flagText').setAttribute('fill', 'red');
      })
      .catch(error => {
        document.getElementById('flagText').textContent = 'Error: ' + error;
        document.getElementById('flagText').setAttribute('fill', 'red');
      });
  </script>
</svg>