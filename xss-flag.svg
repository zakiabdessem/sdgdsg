<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000">
  <rect width="1000" height="1000" fill="white"/>
  <foreignObject x="10" y="10" width="980" height="980">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: monospace; font-size: 20px;">
      <div id="flagContent">Loading flag...</div>
      <script>
        fetch('/flag.txt')
          .then(r => r.text())
          .then(t => document.getElementById('flagContent').textContent = t)
          .catch(e => document.getElementById('flagContent').textContent = 'Error: ' + e);
      </script>
    </div>
  </foreignObject>
</svg> 